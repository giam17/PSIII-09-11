name: CI pruebas automatizadas en dev

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test_app:
    name: FastAPI - 2 pruebas por tipo
    runs-on: ubuntu-latest
    steps:
      - name: checkout del codigo
        uses: actions/checkout@v5
      - name: configurar Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.13"
      - name: instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: 2 pruebas unitarias
        run: python -m pytest tests/test_unit_categoria.py -v --junitxml=reportes/unitarias.xml
      - name: 2 pruebas de integracion
        run: python -m pytest tests/test_integr_cat_prod.py -v --junitxml=reportes/integracion.xml
      - name: 2 pruebas E2E
        run: python -m pytest tests/test_e2e_api_cat.py -v --junitxml=reportes/e2e.xml
      - name: guardar reportes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reportes-python
          path: reportes/*.xml

  test_express:
    name: Express mascotas - 1 prueba por tipo
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend-express
    steps:
      - name: checkout del codigo
        uses: actions/checkout@v5
      - name: configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend-express/package-lock.json
      - name: instalar dependencias
        run: npm ci
      - name: 1 prueba unitaria
        run: npm run test:unit
      - name: 1 prueba de integracion
        run: npm run test:integration
      - name: 1 prueba E2E
        run: npm run test:e2e
